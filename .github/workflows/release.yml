name: Release

# Same trigger and build as .forgejo/workflows/release.yml: any v*.*.* tag
# push builds and packages the binaries. Tags are cut from main by
# convention, not enforced here. This runner has none of the Forgejo runner's
# restrictions (Node and a docker socket are both available), so it uses the
# standard actions and `gh` instead of that workflow's manual git/curl steps.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tooling (make, nfpm)
        # Pinned, not @latest: nfpm's own go.mod can require a newer Go than
        # this repo's go.mod asks setup-go to install (v2.47.0 needs >=1.26.4),
        # and GOTOOLCHAIN=local means setup-go's version is final, not a floor.
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Cross-compile and package (deb, rpm, standalone binaries)
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          make package VERSION="${VERSION}"
          make checksums

      - name: List built artifacts
        run: ls -la dist/

      - name: Create GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
