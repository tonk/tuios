# Trainee - a copy of the Trainer theme (see trainer.toml) for tuios-web's
# own default: the operator's session picks Trainer deliberately for a
# projector, while a trainee's own browser session should already look right
# without them having to pick it, in a lighter/smaller face suited to a
# regular monitor rather than the back of a room.
id           = "trainee"
display_name = "Trainee"
dark         = false
fg           = "#000000"
bg           = "#ffffff"
cursor       = "#008800"
selection_bg = "#5b1b52"

black  = "#000000"
red    = "#cc0403"
green  = "#19cb00"
yellow = "#cecb00"
blue   = "#0d73cc"
purple = "#cb1ed1"
cyan   = "#0dcdcd"
white  = "#dddddd"

bright_black  = "#767676"
bright_red    = "#f2201f"
bright_green  = "#23fd00"
bright_yellow = "#fffd00"
bright_blue   = "#1a8fff"
bright_purple = "#fd28ff"
bright_cyan   = "#14ffff"
bright_white  = "#ffffff"

[ui]
border_focused_window   = "#d3869b"
border_focused_terminal = "#d3869b"
border_unfocused        = "#665c54"

terminal_cursor_fg = "#ffffff"

# Statusbar/dock colors matched to ~/.config/tuios/themes/midnight.toml,
# not derived from trainer.toml, so the dock row looks the same regardless
# of which theme (this one or midnight) is active.
dock_bg       = "#0087d7"
dock_trail_fg = "#1d1f21"

workspace_pill_active_bg   = "#ff0000"
workspace_pill_active_fg   = "#ffff00"
workspace_pill_inactive_bg = "#047562"
workspace_pill_inactive_fg = "#ffffff"

dock_indicator_mouse_active_fg                 = "#7ef7a3"
dock_indicator_mouse_inactive_fg               = "#605f6b"
dock_indicator_tiling_active_fg                = "#7ef7a3"
dock_indicator_tiling_inactive_fg              = "#605f6b"
dock_indicator_focus_follows_mouse_active_fg   = "#7ef7a3"
dock_indicator_focus_follows_mouse_inactive_fg = "#605f6b"

info = "#83a598"

success = "#8ec07c"

# tuios-web only: switches the browser terminal to this font/size. Unlike
# Trainer's larger presenter-facing size, this is sized for a trainee's own
# regular monitor. See internal/theme/webpreset.go.
[web]
font      = "saucecodepro nfm"
font_size = 14
