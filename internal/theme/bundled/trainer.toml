# Trainer - a light, high-contrast theme for teaching or presenting from a
# projector or a shared screen, where a dark background and thin strokes are
# hard to read from the back of the room. Converted from a real kitty config
# built for exactly that. Formerly named "training"; the id changed to
# "trainer" to pair with the "trainee" theme (see trainee.toml) - the
# operator's own screen vs. what a trainee's own browser session shows.
#
# The source kitty config only set foreground/background/cursor/selection/
# border/tab colors, not the 16 ANSI colors - kitty falls back to its own
# built-in default palette for those, so the black/red/green/... below are
# kitty's actual documented defaults, not a guess, to keep ANSI-colored
# output looking the same as it did under the original config.
id           = "trainer"
display_name = "Trainer"
dark         = false
fg           = "#000000"
bg           = "#ffffff"
cursor       = "#008800"
selection_bg = "#5b1b52"

black  = "#000000"
red    = "#cc0403"
green  = "#19cb00"
yellow = "#cecb00"
blue   = "#0d73cc"
purple = "#cb1ed1"
cyan   = "#0dcdcd"
white  = "#dddddd"

bright_black  = "#767676"
bright_red    = "#f2201f"
bright_green  = "#23fd00"
bright_yellow = "#fffd00"
bright_blue   = "#1a8fff"
bright_purple = "#fd28ff"
bright_cyan   = "#14ffff"
bright_white  = "#ffffff"

[ui]
# kitty's active_border_color/inactive_border_color. kitty has no separate
# terminal-mode/window-mode border distinction, so both focused variants
# reuse the same active color.
border_focused_window   = "#d3869b"
border_focused_terminal = "#d3869b"
border_unfocused        = "#665c54"

# kitty's cursor_text_color was "background" (the keyword, meaning "use the
# terminal background under the cursor block"), which is bg (#ffffff) here.
terminal_cursor_fg = "#ffffff"

# Statusbar/dock colors matched to ~/.config/tuios/themes/midnight.toml,
# not derived from the source kitty config, so the dock row looks the same
# regardless of which theme (this one or midnight) is active.
dock_bg       = "#0087d7"
dock_trail_fg = "#1d1f21"

workspace_pill_active_bg   = "#ff0000"
workspace_pill_active_fg   = "#ffff00"
workspace_pill_inactive_bg = "#047562"
workspace_pill_inactive_fg = "#ffffff"

dock_indicator_mouse_active_fg                 = "#7ef7a3"
dock_indicator_mouse_inactive_fg               = "#605f6b"
dock_indicator_tiling_active_fg                = "#7ef7a3"
dock_indicator_tiling_inactive_fg              = "#605f6b"
dock_indicator_focus_follows_mouse_active_fg   = "#7ef7a3"
dock_indicator_focus_follows_mouse_inactive_fg = "#605f6b"

# kitty's url_color (the underline color for hyperlinks): closest tuios
# equivalent is the overlay's informational accent.
info = "#83a598"

# kitty's visual_bell_color/bell_border_color: closest tuios equivalent is
# the overlay's positive/on accent.
success = "#8ec07c"

# tuios-web only: switches the browser terminal to this font/size when
# Trainer is picked from the web settings panel - a larger, heavier weight
# for reading from the back of a room or a shared screen. See
# internal/theme/webpreset.go; "font" is a bundled font alias tuios-web
# resolves itself, not a color.
[web]
font      = "saucecodepro nfm semibold"
font_size = 24
