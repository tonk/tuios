name: Release

# Fires on any version tag push (the existing GitHub release workflow uses the
# same pattern - tags are normally cut from main, but this matches on the tag
# itself, not the branch it happens to point at).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    # This label's image (see the "golang" runner config) is what every step
    # below actually executes inside - there is no bare host to fall back to
    # and no docker socket to assume, so the job is self-sufficient rather
    # than nesting a second container built from Containerfile. That file
    # stays in the repo for reproducing this build locally (podman/docker
    # build -f Containerfile .), it just isn't what CI itself runs in.
    runs-on: golang
    steps:
      # A plain git checkout rather than actions/checkout: that action is a
      # JS action, and this runner's job image has no node in it (only Go),
      # so it can't execute one - see the "node not found" failure this
      # replaced.
      - name: Checkout
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init -q .
          auth_url=$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://x-access-token:${FORGEJO_TOKEN}@#")
          git remote add origin "${auth_url}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD

      - name: Install build tooling (make, nfpm, PAM headers)
        run: |
          set -eu
          apt-get update -qq
          # libpam0g-dev: only needed to build tuios-pam-helper (cgo, see
          # experimental/pam-trainee-auth), a separate Go module tuios/tuios-web
          # themselves have no dependency on.
          apt-get install -y -qq --no-install-recommends make libpam0g-dev
          # Pinned, not @latest: nfpm's own go.mod can require a newer Go than
          # this runner's image has (v2.47.0 needs >=1.26.4).
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Cross-compile and package (deb, rpm, standalone binaries)
        run: |
          set -eu
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${GITHUB_REF_NAME#v}"
          make package VERSION="${VERSION}"
          make package-pam-helper VERSION="${VERSION}"
          make checksums

      - name: List built artifacts
        run: ls -la dist/

      - name: Create Forgejo release and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu

          body=$(curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"draft\":false,\"prerelease\":false}" \
            "${FORGEJO_API}/releases")

          # Extracted without jq, which a runner's default job image is not
          # guaranteed to have: grep out the first "id" field the API answers
          # with, which is the release's own id (it appears before any
          # per-asset object could contribute one, since there are none yet).
          release_id=$(printf '%s' "$body" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          if [ -z "$release_id" ]; then
            echo "Could not parse release id from response:" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

          for f in dist/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading ${name}..."
            curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f}" \
              "${FORGEJO_API}/releases/${release_id}/assets?name=${name}" \
              > /dev/null
          done
