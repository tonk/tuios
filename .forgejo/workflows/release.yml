name: Release

# Fires on any version tag push (the existing GitHub release workflow uses the
# same pattern - tags are normally cut from main, but this matches on the tag
# itself, not the branch it happens to point at).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    # Adjust to whatever label your Forgejo runner exposes for a Docker-capable
    # executor (see the "Prerequisites" note below) - this job shells out to
    # `docker build`/`docker run` itself rather than using the job-level
    # `container:` key, since that key needs an image already sitting in a
    # registry and the whole point here is building one from Containerfile
    # on the fly.
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CI image from Containerfile
        run: docker build -t tuios-ci:${{ github.sha }} -f Containerfile .

      - name: Cross-compile and package (deb, rpm, standalone binaries)
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            "tuios-ci:${GITHUB_SHA}" \
            make package VERSION="${VERSION}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            "tuios-ci:${GITHUB_SHA}" \
            make checksums

      - name: List built artifacts
        run: ls -la dist/

      - name: Create Forgejo release and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu

          body=$(curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"draft\":false,\"prerelease\":false}" \
            "${FORGEJO_API}/releases")

          # Extracted without jq, which a runner's default job image is not
          # guaranteed to have: grep out the first "id" field the API answers
          # with, which is the release's own id (it appears before any
          # per-asset object could contribute one, since there are none yet).
          release_id=$(printf '%s' "$body" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          if [ -z "$release_id" ]; then
            echo "Could not parse release id from response:" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

          for f in dist/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading ${name}..."
            curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f}" \
              "${FORGEJO_API}/releases/${release_id}/assets?name=${name}" \
              > /dev/null
          done
