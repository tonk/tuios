# nfpm package spec for tuios (github.com/goreleaser/nfpm).
#
# ARCH, VERSION and BIN_PATH are supplied as environment variables by
# `make package` (see Makefile) - one invocation of nfpm per (arch, format).
name: "tuios"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Gaurav Gosain <me@gaurav.zip>"
description: |
  Terminal UI Operating System - a terminal-based window manager with
  tmux-style keybindings.
vendor: "tuios"
homepage: "https://github.com/Gaurav-Gosain/tuios"
license: "MIT"

contents:
  - src: "${BIN_PATH}"
    dst: "/usr/local/bin/tuios"
    expand: true
    file_info:
      mode: 0755
