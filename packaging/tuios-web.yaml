# nfpm package spec for tuios-web (github.com/goreleaser/nfpm).
#
# ARCH, VERSION and BIN_PATH are supplied as environment variables by
# `make package` (see Makefile) - one invocation of nfpm per (arch, format).
name: "tuios-web"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Gaurav Gosain <me@gaurav.zip>"
description: |
  tuios-web - the web terminal server companion to tuios, TUIOS's
  terminal-based window manager.
vendor: "tuios"
homepage: "https://github.com/Gaurav-Gosain/tuios"
license: "MIT"

contents:
  - src: "${BIN_PATH}"
    dst: "/usr/local/bin/tuios-web"
    expand: true
    file_info:
      mode: 0755
