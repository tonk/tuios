# nfpm package spec for tuios-web (github.com/goreleaser/nfpm).
#
# ARCH, VERSION and BIN_PATH are supplied as environment variables by
# `make package` (see Makefile) - one invocation of nfpm per (arch, format).
name: "tuios-web"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Ton Kersten <tonk@smartowl.nl>"
description: |
  tuios-web - the web terminal server companion to tuios, TUIOS's
  terminal-based window manager. This package installs the binary and a
  systemd unit (/etc/systemd/system/tuios-web.service) - it does not
  enable or start the service for you; see docs/DEPLOYMENT.md.
vendor: "tuios"
homepage: "https://github.com/tonk/tuios"
license: "MIT"

contents:
  - src: "${BIN_PATH}"
    dst: "/usr/local/bin/tuios-web"
    expand: true
    file_info:
      mode: 0755
  - src: "packaging/systemd/tuios-web.service"
    dst: "/etc/systemd/system/tuios-web.service"
    type: "config|noreplace"
    file_info:
      mode: 0644
