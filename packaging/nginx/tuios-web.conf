# Example nginx reverse-proxy config for tuios-web. See docs/DEPLOYMENT.md
# for the full walkthrough (systemd units, PAM setup, TLS, verification).
#
# tuios-web itself should be bound to loopback only (--host 127.0.0.1, as
# packaging/systemd/tuios-web.service already does) so this is the only
# public-facing listener; nginx here terminates TLS and forwards everything
# - the page load, the --web-settings theme/font endpoints, and the
# WebSocket upgrade - to it over plain HTTP on localhost.
#
# WebTransport (QUIC/UDP/HTTP3) is NOT proxied here - reverse-proxying UDP
# needs nginx's stream module plus real HTTP/3 support, well out of scope
# for a single `location` block. This is not a functional loss: tuios-web's
# browser client already falls back to WebSocket automatically whenever
# WebTransport is unreachable - the same fallback --pam-auth's own internal
# front-door proxy already relies on for the identical reason (see
# pam-helper/README.md, "A side effect of the front door worth knowing
# about"). Expect a brief, harmless connection delay on first load, not a
# broken connection.
#
# Replace tuios.example.com and the certificate paths below (a plain
# `certbot --nginx` run against this file will do both for you), then:
#   sudo cp tuios-web.conf /etc/nginx/sites-available/tuios-web
#   sudo ln -s /etc/nginx/sites-available/tuios-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name tuios.example.com;

    # Let's Encrypt / certbot HTTP-01 challenge, if used.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tuios.example.com;

    ssl_certificate     /etc/letsencrypt/live/tuios.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuios.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # tuios-web streams terminal output continuously; a long-lived, mostly
    # idle WebSocket connection is the normal case here, not a stuck
    # request - nginx's own default (60s) would disconnect an idle session.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;

        # WebSocket upgrade. tuios-web's own front door (--pam-auth mode)
        # proxies the upgrade again internally to sip's loopback instance -
        # nginx only ever needs to know about this one hop.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately left untouched: nginx forwards the Authorization
        # header by default, which is what --pam-auth's HTTP Basic Auth
        # front door needs to see on every request, including this one.
    }
}
